server:
  port: 8080
spring:
  application:
    name: "common-service"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
management:
  endpoints:
    web:
      exposure:
        include: "health"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
pod:
  labels:
    flow: ${POD_LABEL_FLOW:unknown}
    layer: ${POD_LABEL_LAYER:unknown}
