apiVersion: v1
kind: Service
metadata:
  name: consumer-service
  namespace: consumidor-dep # Asegúrate de que este sea el ns donde lo desplegaste
spec:
  selector:
    app: consumer-service # Debe coincidir con el label del Deployment
  ports:
    - protocol: TCP
      port: 8080      # Puerto del Service
      targetPort: 8080 # Puerto donde corre tu Java/Spring
---
