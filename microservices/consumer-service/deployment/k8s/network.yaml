---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: dr-transversal
  namespace: transversales 
spec:
  host: common-service.transversales.svc.cluster.local
  subsets:
    - name: monetario
      labels:
        flow: monetario
    - name: no-monetario
      labels:
        flow: no-monetario
    - name: operativo
      labels:
        flow: operativo
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: vs-target-interno
  namespace: transversales 
spec:
  hosts:
    - common-service.transversales.svc.cluster.local
  http:
    - match:
        - sourceLabels:
            flow: monetario
      route:
        - destination:
            host: common-service.transversales.svc.cluster.local
            subset: monetario
    - match:
        - sourceLabels:
            flow: no-monetario
      route:
        - destination:
            host: common-service.transversales.svc.cluster.local
            subset: no-monetario
    - match:
        - sourceLabels:
            flow: operativo
      route:
        - destination:
            host: common-service.transversales.svc.cluster.local
            subset: operativo
    - directResponse:
        status: 403
        body:
          string: "Accesos denegado - flujo no autorizado"