server:
  port: 8080
spring:
  application:
    name: "consumer-service"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
  health:
    circuitbreakers:
      enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
adapter:
  restconsumer:
    timeout: 5000
    legacy-url: ${LEGACY_URL:http://istio-ingressgateway.istio-system.svc.cluster.local}
    target-url: ${TARGET_URL:http://common-service.transversales.svc.cluster.local}
    path: ${COMMON_SERVICE_PATH:/api/mci/labels}
api:
  base-path: ${API_BASE_PATH:/api/v1/dep}
resilience4j:
  circuitbreaker:
    instances:
      invokeCommon:
        registerHealthIndicator: true
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: "2s"
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        waitDurationInOpenState: "10s"
