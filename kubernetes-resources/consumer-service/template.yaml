**3. La Nueva Network Policy (La Excepción Inteligente)**
```bash
kubectl apply -n app-response-translator -f - <<EOF
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: permitir-consumo-interno-flujos
spec:
  podSelector: {} 
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector: {} 
      podSelector:
        matchExpressions:
        - key: flow
          operator: In
          values:
          - monetario
          - no-monetario
EOF
```

