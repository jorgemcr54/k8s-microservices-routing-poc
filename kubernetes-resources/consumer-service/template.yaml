### Fase 3: La Nueva Estrategia (TO-BE) en Paralelo
Aquí habilitamos el consumo directo sin romper el bloqueo para los demás.

**1. El Service Único y los Subsets (Destination Rule)**
```bash
kubectl apply -n app-response-translator -f - <<EOF
# Service Único para todos los flujos
apiVersion: v1
kind: Service
metadata:
  name: app-response-translator-unico
spec:
  selector:
    app: app-response-translator # Agrupa ambos deployments
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: dr-transversal
spec:
  host: app-response-translator-unico.app-response-translator.svc.cluster.local
  subsets:
  - name: monetario
    labels:
      flow: monetario
  - name: no-monetario
    labels:
      flow: no-monetario
  - name: operativo
    labels:
      flow: operativo    
EOF
```

**2. Virtual Service de Enrutamiento por Origen (SourceLabels)**
```bash
kubectl apply -n app-response-translator -f - <<EOF
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: vs-target-interno
spec:
  hosts:
  - app-response-translator-unico.app-response-translator.svc.cluster.local
  http:
  - match:
    - sourceLabels:
        flow: monetario
    route:
    - destination:
        host: app-response-translator-unico.app-response-translator.svc.cluster.local
        subset: monetario
  - match:
    - sourceLabels:
        flow: no-monetario
    route:
    - destination:
        host: app-response-translator-unico.app-response-translator.svc.cluster.local
        subset: no-monetario
  - match:
    - sourceLabels:
        flow: operativo
    route:
    - destination:
        host: app-response-translator-unico.app-response-translator.svc.cluster.local
        subset: operativo      
  - directResponse:
      status: 403
      body:
        string: "Accesos denegado - flujo no autorizado"
        
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: dr-transversal
spec:
  host: app-response-translator-unico.app-response-translator.svc.cluster.local
  subsets:
  - name: monetario
    labels:
      flow: monetario
  - name: no-monetario
    labels:
      flow: no-monetario
  - name: operativo
    labels:
      flow: operativo            
EOF
```
***********************************************************************************
**2. Virtual Service de Enrutamiento por Origen (SourceLabels)**
```bash
kubectl apply -n app-response-translator -f - <<EOF
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: vs-target-interno
spec:
  hosts:
  - app-response-translator-unico.app-response-translator.svc.cluster.local
  http:
  - match:
    - sourceLabels:
        flow: monetario
    route:
    - destination:
        host: app-response-translator-unico.app-response-translator.svc.cluster.local
        subset: monetario
  - match:
    - sourceLabels:
        flow: no-monetario
