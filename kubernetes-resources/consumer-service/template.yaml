### Fase 1: El Escenario Actual (AS-IS)
Aquí montamos la infraestructura que ya tienes: la restricción de red y el consumo que "da la vuelta" por el balanceador (Ingress Gateway).

**1. Preparar Namespaces y Bloqueo de Red**
```bash
# Crear namespaces
kubectl create namespace consumidor-dep
kubectl create namespace app-response-translator

kubectl create namespace consumidor-pagos

kubectl create namespace consumidor-operativo
kubectl label namespace consumidor-operativo istio-injection=enabled
# Habilitar Istio en ambos
kubectl label namespace consumidor-dep istio-injection=enabled
kubectl label namespace consumidor-pagos istio-injection=enabled
kubectl label namespace app-response-translator istio-injection=enabled

# Aplicar la Network Policy de Bloqueo (Default Deny)
kubectl apply -f - <<EOF
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-cross-ns
  namespace: app-response-translator
spec:
  podSelector: {} # Protege a TODOS los pods en el ns
  policyTypes:
  - Ingress
  # Al no haber reglas de 'ingress', bloquea todo el tráfico de otros NS
EOF
--- Netpol para ingressgateway legacy
kubectl apply -n app-response-translator -f - <<EOF
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: permitir-ingress-gateway
  namespace: app-response-translator
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: istio-system
      podSelector:
        matchLabels:
          istio: ingressgateway
EOF

```

**2. Desplegar los Componentes app-response-translator (Versión Actual)**
Cada flujo tiene su propio Service para que el balanceador sepa a dónde ir.
```bash
kubectl apply -n app-response-translator -f - <<EOF
# --- SERVICIO MONETARIO ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-response-translator-monetario
spec:
  selector:
    matchLabels:
      app: app-response-translator
      flow: monetario
  template:
    metadata:
      labels:
        app: app-response-translator
        flow: monetario
        version: monetario
    spec:
      containers:
      - name: httpbin
        image: kennethreitz/httpbin
        ports:
        - containerPort: 80
---

apiVersion: v1
kind: Service
metadata:
  name: svc-monetario-legacy
spec:
  selector:
    app: app-response-translator
    flow: monetario
  ports:
  - port: 80
    targetPort: 80

---
# --- SERVICIO NO-MONETARIO ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-response-translator-no-monetario
spec:
  selector:
    matchLabels:
      app: app-response-translator
      flow: no-monetario
  template:
    metadata:
      labels:
        app: app-response-translator
        flow: no-monetario
        version: no-monetario
    spec:
      containers:
      - name: httpbin
        image: kennethreitz/httpbin
        ports:
        - containerPort: 80
---
# --- SERVICIO operativo ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-response-translator-operativo
spec:
  selector:
    matchLabels:
      app: app-response-translator
      flow: operativo
  template:
    metadata:
      labels:
        app: app-response-translator
        flow: operativo
        version: operativo
    spec:
      containers:
      - name: httpbin
        image: kennethreitz/httpbin
        ports:
        - containerPort: 80
---

apiVersion: v1
kind: Service
metadata:
  name: svc-no-monetario-legacy
spec:
  selector:
    app: app-response-translator
    flow: no-monetario
  ports:
  - port: 80
    targetPort: 80
EOF
```

**3. Gateway y Virtual Service para entrada por Balanceador (Legacy)**
```bash
kubectl apply -n app-response-translator -f - <<EOF
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: legacy-gateway
spec:
  selector:
    istio: ingressgateway
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - "midominiointerno.lab"
EOF
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: vs-legacy
spec:
  hosts:
  - "midominiointerno.lab"
  gateways:
  - legacy-gateway
  http:
  - match:
    - uri:
        prefix: "/legacy/monetario"
    rewrite:
      uri: "/"
    route:
    - destination:
        host: svc-monetario-legacy.app-response-translator.svc.cluster.local
  - match:
    - uri:
        prefix: "/legacy/no-monetario"
    rewrite:
      uri: "/"
    route:
    - destination:
        host: svc-no-monetario-legacy.app-response-translator.svc.cluster.local
EOF
```

