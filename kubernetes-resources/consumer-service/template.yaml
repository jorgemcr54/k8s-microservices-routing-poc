### Cómo verificar ambos mundos en paralelo

Primero, entra al pod del cliente:
```bash
export POD_CLIENTE=$(kubectl get pod -n consumidor-dep -l flow=monetario -o jsonpath='{.items[0].metadata.name}')
```

**Prueba 1: Escenario Actual (Legacy)**
Consumimos saliendo al IngressGateway (Simulando el ALB externo).
```bash
kubectl exec -it $POD_CLIENTE -n consumidor-dep -- curl -v -H "Host: midominiointerno.lab" http://istio-ingressgateway.istio-system.svc.cluster.local/legacy/monetario/get
```
*Esto funciona porque el Gateway tiene permiso de red y el tráfico es "externo" al namespace.*

**Prueba 2: Escenario Nuevo (Target)**
Consumimos directamente por el nombre del servicio interno.
```bash
kubectl exec -it $POD_CLIENTE -n consumidor-dep -- curl -v http://app-response-translator-unico.app-response-translator.svc.cluster.local/get
```
*Esto funciona porque Istio detecta que eres `flow: monetario`, te enruta al subset correcto, y la nueva Network Policy te deja pasar por red interna.*

**Prueba 3: Escenario Nuevo (Target)** pagos
Consumimos directamente por el nombre del servicio interno.
```bash
export POD_CLIENTE_PAGOS=$(kubectl get pod -n consumidor-pagos -l flow=no-monetario -o jsonpath='{.items[0].metadata.name}')

kubectl exec -it $POD_CLIENTE_PAGOS -n consumidor-pagos -- curl -v http://app-response-translator-unico.app-response-translator.svc.cluster.local/get


**Prueba 4: Escenario operativo
Consumimos directamente por el nombre del servicio interno.
```bash
export POD_CLIENTE_OPER=$(kubectl get pod -n consumidor-operativo -l flow=operativo -o jsonpath='{.items[0].metadata.name}')

kubectl exec -it $POD_CLIENTE_OPER -n consumidor-operativo -- curl -v http://app-response-translator-unico.app-response-translator.svc.cluster.local/get



